<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{% block title %}Underwriting Packet Viewer{% endblock %}</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      font-family: -apple-system, "Segoe UI", Arial, sans-serif;
      max-width: 900px; margin: 2rem auto; padding: 0 1rem; line-height: 1.5;
    }
    header { border-bottom: 2px solid #666; margin-bottom: 1.5rem; padding-bottom: .75rem; }
    h1 { margin: 0 0 .25rem; }
    .subtitle { color: #888; font-size: .9rem; }
    nav.sections { margin-bottom: 1.5rem; }
    nav.sections a { margin-right: .9rem; font-size: .9rem; white-space: nowrap; }
    section { margin-bottom: 2rem; }
    section h2 { border-bottom: 1px solid #999; padding-bottom: .25rem; }
    table { border-collapse: collapse; width: 100%; margin-bottom: .5rem; }
    th, td { text-align: left; padding: .4rem .6rem; border-bottom: 1px solid #ccc; vertical-align: top; }
    th { background: rgba(128, 128, 128, .15); }
    .badge { display: inline-block; padding: .1rem .5rem; border-radius: .75rem; font-size: .75rem; font-weight: 600; }
    .badge-lg { padding: .3rem .9rem; border-radius: 1rem; font-size: .95rem; }
    /* risk_flags[].severity (low/moderate/high) */
    .badge-low { background: #d7f5d7; color: #1a5c1a; }
    .badge-moderate { background: #ffe6b3; color: #7a4d00; }
    .badge-high { background: #ffd0d0; color: #8a1c1c; }
    /* risk_band (Low/Medium/High/Very high) from the scoring framework — a
       separate vocabulary from severity above, so a distinct class prefix */
    .badge-band-low { background: #d7f5d7; color: #1a5c1a; }
    .badge-band-medium { background: #ffe6b3; color: #7a4d00; }
    .badge-band-high { background: #ffd0d0; color: #8a1c1c; }
    .badge-band-very-high { background: #4a1414; color: #ffd0d0; }
    .quote { color: #888; font-style: italic; }
    .source-item { margin-bottom: .3rem; }
    .disclaimer {
      background: rgba(255, 190, 0, .15); border: 1px solid rgba(255, 170, 0, .5);
      padding: .75rem 1rem; border-radius: .4rem; margin-bottom: 1.5rem; font-size: .9rem;
    }
    .score-banner {
      display: flex; gap: 2rem; align-items: center; flex-wrap: wrap;
      background: rgba(128, 128, 128, .1); border: 1px solid rgba(128, 128, 128, .3);
      padding: 1rem 1.25rem; border-radius: .5rem; margin-bottom: 1.5rem;
    }
    .score-banner .metric { font-size: .8rem; color: #888; text-transform: uppercase; letter-spacing: .03em; }
    .score-banner .value { font-size: 1.3rem; font-weight: 700; }
    .case-list-table td, .case-list-table th { vertical-align: middle; }
    .case-list-table a { font-size: 1.02rem; font-weight: 600; }
    a { color: #2e7dc8; }
  </style>
</head>
<body>
  <header>
    <h1>{% block header %}Underwriting Packet Viewer{% endblock %}</h1>
    <div class="subtitle">{% block subtitle %}{% endblock %}</div>
  </header>
  {% block content %}{% endblock %}
</body>
</html>
